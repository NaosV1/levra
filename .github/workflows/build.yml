# Checks the Rust core and builds the disk image on every push to main and
# every pull request. Builds of main are signed with Developer ID and
# notarized like a release, then replace the "edge" pre-release, so that the
# latest app is always at the same address and opens without warning. Pull
# requests get an app signed ad hoc, for testing, and never see the secrets.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the number of commits.
          fetch-depth: 0

      - name: Outils Rust
        run: rustup component add clippy rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: App de test
        if: github.ref != 'refs/heads/main'
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh build/Levra.app build/Levra.dmg

      - name: Trousseau de signature
        if: github.ref == 'refs/heads/main'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: scripts/ci-keychain.sh

      - name: App signée et notarisée
        if: github.ref == 'refs/heads/main'
        run: |
          LEVRA_NOTARY_PROFILE=levra scripts/release.sh
          mv build/Levra-*.dmg build/Levra.dmg

      - uses: actions/upload-artifact@v7
        with:
          path: build/Levra.dmg
          archive: false
          retention-days: 14

  # Apart from the build, so that the code of a pull request never runs with
  # a token allowed to write to the repository.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: edge-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Levra.dmg

      - name: Pré-version « edge »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view edge >/dev/null 2>&1; then
            gh release delete edge --cleanup-tag --yes
          fi
          gh release create edge Levra.dmg --target "$GITHUB_SHA" --prerelease \
            --title "Levra – dernière version de main" \
            --notes "Build automatique de ${GITHUB_SHA:0:7}, signé et notarisé par Apple, remplacé à chaque push sur main."
