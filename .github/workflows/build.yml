# Checks the Rust core and builds the disk image on every push to main and
# every pull request. Every push to main is published as a new version:
# signed with Developer ID, notarized, with the appcast through which
# installed copies update to it, within a day. Its number is major.minor
# from app/Info.plist, then the build number. Pull requests get an app
# signed ad hoc, for testing, and never see the secrets.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes a build still running: only the latest is
# published, and versions go out in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the number of commits.
          fetch-depth: 0

      - name: Outils Rust
        run: rustup component add clippy rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: App de test
        if: github.ref != 'refs/heads/main'
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh build/Levra.app build/Levra.dmg

      - uses: actions/upload-artifact@v7
        if: github.ref != 'refs/heads/main'
        with:
          path: build/Levra.dmg
          archive: false
          retention-days: 14

      - name: Trousseau de signature
        if: github.ref == 'refs/heads/main'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: scripts/ci-keychain.sh

      - name: App signée et notarisée
        if: github.ref == 'refs/heads/main'
        run: LEVRA_NOTARY_PROFILE=levra scripts/release.sh

      - name: Version
        id: version
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Levra.app/Contents/Info.plist)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Appcast
        if: github.ref == 'refs/heads/main'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_PRIVATE_KEY manquant : voir « Mises à jour » dans README.md."
            exit 1
          fi
          scripts/appcast.sh build/Levra.app "build/Levra-$VERSION.dmg" > build/appcast.xml

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: release
          path: |
            build/Levra-*.dmg
            build/appcast.xml
          retention-days: 1

  # Apart from the build, so that the code of a pull request never runs with
  # a token allowed to write to the repository.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" "Levra-$VERSION.dmg" appcast.xml \
            --target "$GITHUB_SHA" --title "Levra $VERSION" --generate-notes
