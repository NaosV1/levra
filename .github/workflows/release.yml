# Pushing a tag such as v0.2.0 publishes a GitHub release with the disk
# image that scripts/release.sh builds: signed with Developer ID, notarized
# and stapled. The tag must match CFBundleShortVersionString in
# app/Info.plist. The secrets it needs are listed in README.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" app/Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de app/Info.plist."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Trousseau de signature
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: scripts/ci-keychain.sh

      - name: Tests
        run: cargo test --workspace

      - name: Build, signature et notarisation
        run: LEVRA_NOTARY_PROFILE=levra scripts/release.sh

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Levra-$VERSION.dmg" \
            --title "Levra $VERSION" --generate-notes --verify-tag
